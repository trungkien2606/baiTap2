<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Murach Survey</title>

    <link rel="stylesheet" href="styles/main.css">
</head>

<body>

    <header>
        <img src="img/logoTruong.jpg" alt="Logo" width="100">
    </header>

    <main>

        <h1>Survey</h1>

        <p>
            If you have a moment, we'd appreciate it if you would fill out
            this survey.
        </p>

        <h2>Your information:</h2>

        <form action="emailList" method="post">

            <input type="hidden" name="action" value="add">

            <div>
                <label for="firstName">First Name</label>
                <input type="text"
                       id="firstName"
                       name="firstName"
                       required>
            </div>

            <div>
                <label for="lastName">Last Name</label>
                <input type="text"
                       id="lastName"
                       name="lastName"
                       required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       required>
            </div>

            <div>
                <label for="birthDate">Date of Birth</label>
                <input type="text"
                       id="birthDate"
                       name="birthDate">
            </div>


            <h2>How did you hear about us?</h2>

            <label class="radio">
                <input type="radio"
                       name="source"
                       value="Search engine"
                       checked>
                Search engine
            </label>

            <label class="radio">
                <input type="radio"
                       name="source"
                       value="Word of mouth">
                Word of mouth
            </label>

            <label class="radio">
                <input type="radio"
                       name="source"
                       value="Social Media">
                Social Media
            </label>

            <label class="radio">
                <input type="radio"
                       name="source"
                       value="Other">
                Other
            </label>


            <h2>
                Would you like to receive announcements<br>
                about new CDs and special offers?
            </h2>

            <label class="check">
                <input type="checkbox"
                       name="offers"
                       value="yes">
                YES, I'd like that.
            </label>

            <br>

            <label class="check">
                <input type="checkbox"
                       name="emailAnnouncements"
                       value="yes">
                YES, please send me email announcements.
            </label>


            <p>
                <label for="contact">Please contact me by:</label>

                <select id="contact" name="contact">

                    <option value="Email or postal mail">
                        Email or postal mail
                    </option>

                    <option value="Email">
                        Email
                    </option>

                    <option value="Postal mail">
                        Postal mail
                    </option>
                </select>
            </p>

            <button type="submit">Submit</button>

        </form>

    </main>
    
</body>

</html>
